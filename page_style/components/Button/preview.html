<!doctype html><html lang="es" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;background:var(--surface)}</style></head><body><div class="ds-root" style="padding:24px;display:flex;flex-direction:column;gap:20px">
  <div class="ds-row" style="align-items:center">
    <button class="ds-btn ds-btn--primary">Comprar ahora</button>
    <button class="ds-btn ds-btn--secondary">Ver ficha de cata</button>
    <a class="ds-btn ds-btn--accent" href="#">Conoce el origen</a>
    <a class="ds-btn ds-btn--ghost" href="#">Leer la historia</a>
    <button class="ds-btn ds-btn--primary" disabled>Agotado</button>
  </div>
  <div class="ds-row" style="align-items:center">
    <button class="ds-btn ds-btn--primary ds-btn--lg">Suscríbete al café del mes</button>
    <button class="ds-btn ds-btn--secondary ds-btn--sm">Añadir 250 g</button>
    <span style="display:inline-flex;gap:12px;padding:14px;border-radius:20px;background:var(--monte-900)"><button class="ds-btn ds-btn--gold">Desliza <span class="ds-btn__arrow">→</span></button><button class="ds-btn ds-btn--secondary" style="color:var(--pergamino-50);border-color:var(--pergamino-50)">Ver planes</button></span>
    <span style="position:relative;display:inline-flex;padding:14px;border-radius:20px;overflow:hidden">
      <img src="../../assets/Fotografia/chicamocha-canon.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
      <span style="position:absolute;inset:0;background:var(--scrim)"></span>
      <button class="ds-btn ds-btn--on-photo" style="position:relative">Explorar regiones</button>
    </span>
  </div>
</div></body></html>
